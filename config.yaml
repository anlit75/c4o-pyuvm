# c4o-pyuvm design configuration
#
# A LibreLane configuration file. The same file drives linting and simulation
# through c4o-core and the physical flow through LibreLane, so the variable
# names are LibreLane's. Keys starting with '//' are c4o-core's; LibreLane
# ignores them. 'dir::' marks a path as relative to this directory.

# ============ what you normally change ============

DESIGN_NAME: apb_uart_sv

# The generated Verilog, not the SystemVerilog it came from. `make rtl` writes
# it; src/vendor/apb_uart_sv/README.md says why it is committed. A glob does not
# work here: LibreLane validates each entry as a literal path.
VERILOG_FILES:
  - dir::src/apb_uart_sv.v

# Simulation only -- LibreLane has no testbench variable, since simulation sits
# outside an RTL-to-GDSII flow.
"//TEST_FILES":
  - dir::test/*.v

# The pyuvm tests. cocotb finds them by module name, so only the files that
# define @cocotb.test() go here -- apb_agent.py and uart_env.py are imported by
# them, from the same directory, which c4o-core puts on PYTHONPATH.
"//COCOTB_TESTS":
  - dir::test/test_*.py

# What the results page (`make site`) draws from the smoke test's VCD: the APB
# writes that configure the UART and send 0xA5, the status reads, and the
# serial line carrying the byte.
"//WAVE_SIGNALS":
  - tb_apb_uart.PSEL
  - tb_apb_uart.PWRITE
  - tb_apb_uart.PADDR
  - tb_apb_uart.PWDATA
  - tb_apb_uart.PRDATA
  - tb_apb_uart.serial

CLOCK_PORT: CLK

# 90.9 MHz, not 100. Required time is
#
#   period - 0.25 (clock uncertainty) - IO_DELAY_CONSTRAINT x period
#
# and the path from uart_rx_fifo_i's read pointer through the APB read mux to
# PRDATA arrives at 9.28 ns, of which 2.83 ns are delay cells the flow inserted
# to fix hold. Hold slack is +0.10 ns, so it cannot insert fewer. 100 MHz is
# reachable only by claiming zero external delay on the ports -- which says
# whatever latches PRDATA needs no setup time of its own.
CLOCK_PERIOD: 11.0

# ============ keep these unless you know what you are doing ============

PDK: sky130A
STD_CELL_LIBRARY: sky130_fd_sc_hd

FP_CORE_UTIL: 40
FP_SIZING: relative

# The sky130 default is 20: a fifth of every clock period reserved as external
# delay on the ports. That is right for a design whose pins drive a package and
# a board, and wrong for a block whose PRDATA goes to an APB master on the same
# die. 5 leaves a 0.55 ns port budget, which is a real same-die hop.
#
# It is a percentage, which also makes the clock period a poor lever: at 20,
# each added nanosecond of period gives back only 0.8 ns.
IO_DELAY_CONSTRAINT: 5

# Two Verilator warnings, waived for two different reasons, named one code at a
# time so that a third warning still stops the build.
#
# LATCH is the DUT's, and not ours to fix:
#
#   %Warning-LATCH: Latch inferred for signal 'apb_uart_sv.fifo_tx_data'
#                   (not all control paths of combinational always assign a
#                   value)
#
# An always_comb that does not assign fifo_tx_data on every path. It survives
# the translation to Verilog, so it is the design and not sv2v. Verifying a
# design you may not edit is what this repository is about, so it is waived with
# its reason rather than patched out.
#
# WIDTHEXPAND is sv2v's: it renders `$unsigned(BUFFER_DEPTH - 1)` as a 32-bit
# constant, and Verilator objects to comparing that against a 4-bit pointer. The
# comparison is correct; the widths are the translator's.
LINTER_DISABLE_WARNINGS: [LATCH, WIDTHEXPAND]

# The blackbox stubs LibreLane generates for the PDK cells carry no timescale,
# so TIMESCALEMOD fires once per cell -- none of them from the design. UNDRIVEN
# and UNUSEDSIGNAL are in c4o-core's default list for the same kind of reason,
# and have to be repeated because this key overrides rather than appends.
LINTER_DISABLE_WARNINGS_BLACKBOX: [UNDRIVEN, UNUSEDSIGNAL, TIMESCALEMOD]

# The pre-synthesis check finds eight logic loops in this design and, at the
# default, quits at stage 8 of 80 -- so `make gds` never reaches a GDS. All
# eight are the same dead register:
#
#   Warning: found logic loop in module apb_uart_sv:
#       cell $procdff$1552 ($aldff) source: src/apb_uart_sv.v:229.2-249.6
#         AD[0] --> Q[0]
#
# regs_q is ten bytes of register file. The asynchronous reset assigns nine of
# them and leaves out byte 0 -- THR/RBR -- so yosys builds a reset value with
# regs_q[7:0] inside it, which is not constant, which makes the register an
# $aldff whose load input is its own output. Eight bits, eight self-loops.
#
# Those eight bits are dead: writes to THR go to fifo_tx_data and reads of RBR
# come back from fifo_rx_data, so nothing ever touches regs_q[7:0]. The same
# check after opt reports zero problems, and none of it reaches the netlist.
#
# Turning the checker off is blunt -- it would stop reporting a real
# combinational loop too -- so verify.yml asserts the two reports directly:
# exactly eight problems before opt, all eight naming regs_q, and a clean report
# after. A new loop moves one of those numbers and CI goes red.
ERROR_ON_SYNTH_CHECKS: false
