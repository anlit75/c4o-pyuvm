name: RTL to GDSII

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore here, deliberately. A required status check that never runs
  # is not "skipped". It stays at "Expected", waiting for status to be reported, and
  # the pull request can never be merged. The `changes` job below skips the flow
  # for a docs-only pull request instead, and reports as skipped.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # A pull request that changes only what the push trigger above ignores (Markdown,
  # LICENSE, .gitignore) does not run the flow. No step below reads
  # any of those files.
  #
  # Decided in a job because of the trap described above: with paths-ignore the
  # check never reports, and here it reports as skipped. Everything is unchecked
  # on such a pull request. One that touches any other file runs all of it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Does this change anything the flow reads?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "$files"
          other=$(grep -vxE '.*\.md|LICENSE|\.gitignore' <<<"$files" || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Docs only: the flow is not run for this pull request."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The Dev Container is the "zero install" promise, and nothing else here
  # exercises it. The job below runs on the host, against the plain image.
  # So a devcontainer.json change could only be caught by opening a Codespace
  # by hand, which is how `remoteUser` broke once already.
  #
  # Builds it for real and checks the two things `make gds` needs from it: a
  # Docker daemon that answers (the guard's exact condition), and the
  # in-container delegation path the Makefile takes when it finds the
  # entrypoint script locally. It does not run `make gds` itself, because that wants
  # a multi-GB PDK and a long run. It cannot speak for Codespaces, whose
  # remote server is a different thing again.
  devcontainer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Dev Container and use it
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -e
            echo "--- the daemon 'make gds' guards on ---"
            docker info > /dev/null
            docker version --format '{{.Server.Version}}'
            echo "--- the in-container delegation path ---"
            make lint

  # The steps every repository made from the ChipForAll template shares (the
  # image and PDK setup, the fast checks, the flow, the report, the uploads)
  # are composite actions in c4o-core, so a fix to them arrives here without
  # anybody copying it. The steps written out below are this repository's own.
  # They sit in the same job because they read what the flow leaves in runs/
  # and build/.
  full-flow:
    needs: changes
    # Runs unless the job above said no. If that job fails, its output is
    # empty and this still runs: a broken decision must not look like a pass.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read  # only to ask whether Pages is on
    outputs:
      publish-pages: ${{ steps.report.outputs.publish-pages }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: anlit75/c4o-core/actions/setup@v2

      # Lint, the Verilog testbench, the pyuvm tests against the RTL (their
      # output is kept in build/cocotb-rtl.log, which the Report step compares
      # the gate-level run with), synthesis and the schematic.
      - name: Fast checks
        uses: anlit75/c4o-core/actions/checks@v2

      # tb/uart_ral.py is generated from regs/apb_uart.rdl and committed, so a
      # fresh clone can run the tests. Committing generated code buys that and
      # costs the possibility of drift: edit the .rdl, forget `make ral`, and the
      # tests keep checking the old map while the .rdl documents a new one.
      #
      # So regenerate it here and diff. The file is left exactly as peakrdl writes
      # it, with no header of ours, which is what makes this comparison the tool's
      # output against the tool's output and nothing else.
      - name: The register model matches the .rdl it came from
        run: |
          cp tb/uart_ral.py /tmp/committed.py
          make ral
          if ! diff -u /tmp/committed.py tb/uart_ral.py; then
            echo "tb/uart_ral.py is not what regs/apb_uart.rdl generates."
            echo "Run 'make ral' and commit the result."
            exit 1
          fi
          echo "tb/uart_ral.py is byte-identical to what make ral produces."

      # rtl/apb_uart_sv.v is sv2v's output for rtl/vendor/apb_uart_sv/*.sv plus a
      # header of ours, committed so a fresh clone can run the flow. Same
      # drift as above: change the SystemVerilog or the header in the Makefile,
      # forget `make rtl`, and the flow reads a file that is out of date.
      - name: The Verilog matches the SystemVerilog it came from
        run: |
          cp rtl/apb_uart_sv.v /tmp/committed_rtl.v
          make rtl
          if ! diff -u /tmp/committed_rtl.v rtl/apb_uart_sv.v; then
            echo "rtl/apb_uart_sv.v is not what make rtl generates."
            echo "Run 'make rtl' and commit the result."
            exit 1
          fi
          echo "rtl/apb_uart_sv.v is byte-identical to what make rtl produces."

      - name: Physical design
        uses: anlit75/c4o-core/actions/gds@v2

      # config.yaml turns ERROR_ON_SYNTH_CHECKS off, because the DUT's register
      # file has eight dead self-looping bits that would otherwise stop the flow
      # before it draws anything. The reason is written there, at length. This is
      # the assertion that stands in for the check it disabled: exactly eight
      # problems before opt, all eight naming regs_q, and a clean report after.
      #
      # A real combinational loop added to this design moves one of those three
      # numbers, so it goes red here instead of passing quietly.
      - name: The synthesis checks the flow was told not to fail on are the known ones
        run: |
          pre=$(ls runs/*/*-yosys-synthesis/reports/pre_synth_chk.rpt)
          post=$(ls runs/*/*-yosys-synthesis/reports/chk.rpt)
          echo "--- $pre ---"
          cat "$pre"
          grep -qF "Found and reported 8 problems." "$pre" || {
            echo "The pre-synthesis check no longer reports exactly 8 problems. They are above."
            exit 1
          }
          loops=$(grep -c "found logic loop" "$pre")
          regs=$(grep -c 'wire \\regs_q \[[0-7]\]' "$pre")
          if [ "$loops" != 8 ] || [ "$regs" != 8 ]; then
            echo "Expected 8 logic loops, all of them regs_q[7:0]; got $loops loops and $regs regs_q bits."
            exit 1
          fi
          grep -qF "Found and reported 0 problems." "$post" || {
            echo "The check after opt is no longer clean:"
            cat "$post"
            exit 1
          }
          echo "8 pre-synthesis loops, all regs_q[7:0]; nothing left after opt."

      # `make report` says "setup slack -0.75 ns (24 violations)" and nothing
      # says which paths. LibreLane wrote them down, per corner, inside the
      # STA step's directory, but nothing points anyone at that, so a timing
      # violation in this repository is a number you cannot look into unless you
      # already know the step layout. Print them where the run can be read.
      #
      # Diagnostic, not a gate. Whether setup violations should stop the flow is
      # LibreLane's call and it says warning, so this step does not second-guess
      # it. It fails only when the report is missing or is not a timing report,
      # which is what happens when the layout moves and a step like this quietly
      # starts printing nothing, so it lists what it did find before giving up.
      - name: Print the setup paths the flow could not close
        run: |
          shopt -s nullglob
          rpts=(runs/*/*-openroad-stapostpnr/*ss_*/checks.rpt)
          if [ ${#rpts[@]} -eq 0 ]; then
            echo "No slow-corner checks.rpt under runs/*/*-openroad-stapostpnr/."
            echo "What is there:"
            ls -d runs/*/*sta* 2>/dev/null || echo "  no STA step directory at all"
            find runs -name 'checks.rpt' 2>/dev/null | head -20
            exit 1
          fi
          rpt="${rpts[0]}"
          echo "--- $rpt ---"
          grep -qF "slack" "$rpt" || { echo "$rpt names no slack -- not a timing report"; exit 1; }
          sed -n '/slack_max/,$p' "$rpt" | head -250

      # The flow reports setup violations as a warning, so without this step the
      # repository can go green on a design that misses its own clock, which it
      # did, for two runs. `make report` already prints the numbers. This is what
      # makes them count.
      #
      # A gate and not another warning, on purpose. IO_DELAY_CONSTRAINT in
      # config.yaml is pinned so that this design closes 100 MHz, and a claim
      # nothing checks is a claim that rots. It runs after the step above, so a
      # failure here comes with the paths already printed.
      - name: Timing closes
        run: |
          report=$(make report)
          echo "$report"
          setup=$(echo "$report" | grep "setup slack")
          hold=$(echo "$report" | grep "hold slack")
          for row in "$setup" "$hold"; do
            case "$row" in
              *"(0 violations)") ;;
              *) echo "Timing does not close:$row"
                 echo "The violating paths are in the step above."
                 exit 1 ;;
            esac
          done
          echo "Timing closes:$setup /$hold"

      # The action also runs the same pyuvm tests again against the gates that
      # `make gds` produced, and fails unless the summary line matches the RTL
      # run's. Not a second testbench. It is the same Python. If a test reaches
      # inside the design, that is where it shows up, on every pull request.
      - name: Report
        id: report
        uses: anlit75/c4o-core/actions/report@v2
        with:
          sections: |
            Coverage

      # docs/guide.md, "Iterating without re-running the whole flow", gives one
      # command for resuming from floorplan. Nothing ran the command it used to
      # give, and it had stopped working three separate ways with every other
      # step here green. So run it, and check what that section says: the
      # resume needs the state file it names, synthesis is not redone, and the
      # resumed steps are added after the old ones.
      #
      # Last among the flow steps, so a failure here does not hide theirs, and
      # so the steps above read a run directory with one of each step.
      #
      # Not on pull requests: it runs the flow from floorplan a second time,
      # and the command only changes when the Makefile or the LibreLane pin
      # does. Phrased as "not a pull request", so workflow_dispatch exercises
      # it on a branch before merging.
      - name: Resuming from floorplan works, as the guide says it does
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          netlists=(runs/*/*-yosys-synthesis/*.nl.v)
          states=(runs/*/*-openroad-floorplan/state_in.json)
          if [ ${#netlists[@]} -ne 1 ] || [ ${#states[@]} -ne 1 ]; then
            echo "::error::Expected one synthesis step and one floorplan step under runs/ before resuming, found ${#netlists[@]} and ${#states[@]}. make gds did not start from an empty run."
            exit 1
          fi
          before=$(stat -c %Y "${netlists[0]}")

          make gds LIBRELANE_ARGS="--from OpenROAD.Floorplan --with-initial-state ${states[0]}"

          after=$(stat -c %Y "${netlists[0]}")
          synth=(runs/*/*-yosys-synthesis)
          if [ "$before" != "$after" ] || [ ${#synth[@]} -ne 1 ]; then
            echo "::error::The guide says resuming from floorplan does not redo synthesis. It was redone:"
            ls -ld --time-style=full-iso "${synth[@]}" "${netlists[0]}"
            exit 1
          fi
          floorplans=(runs/*/*-openroad-floorplan)
          if [ ${#floorplans[@]} -ne 2 ]; then
            echo "::error::The guide says the resumed steps are added after the old ones. Expected two floorplan directories, found ${#floorplans[@]}:"
            printf '  %s\n' "${floorplans[@]}"
            exit 1
          fi
          echo "  resumed from floorplan: synthesis kept, resumed steps added after the old ones"

      - name: Upload
        if: always()
        uses: anlit75/c4o-core/actions/upload@v2

  # Publishes the page full-flow built. A job of its own because deploying to
  # Pages needs an OIDC token and the github-pages environment, and neither
  # belongs on the job that runs everything else.
  pages:
    needs: full-flow
    if: needs.full-flow.outputs.publish-pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the results page
        id: deploy
        uses: actions/deploy-pages@v5
